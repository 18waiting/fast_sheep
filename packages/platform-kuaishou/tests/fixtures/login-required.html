<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>synthetic kuaishou login</title></head>
<body data-fw-kuaishou-login>
  <div data-fw-kuaishou-login>请登录</div>
  <div data-fw-kuaishou-chat-list>
    <div data-fw-kuaishou-conversation data-conversation-id="c1" data-active="true" data-buyer-id="buyer-1" data-buyer="测试买家A">测试买家A</div>
  </div>
  <textarea data-fw-kuaishou-composer-input></textarea>
  <button data-fw-kuaishou-send-btn>发送</button>
  <script>
    document.addEventListener("click", function (e) {
      var btn = e.target && e.target.closest ? e.target.closest("[data-fw-kuaishou-send-btn]") : null;
      if (!btn) return;
      var input = document.querySelector("[data-fw-kuaishou-composer-input]");
      var messages = document.querySelector("[data-fw-kuaishou-messages]");
      var ack = document.querySelector("[data-fw-kuaishou-send-ack]");
      if (!input || !messages) return;
      var value = input.getAttribute("value") || input.value || "";
      if (!value) return;
      var mid = (ack && ack.getAttribute("data-message-id")) || "ack-" + Date.now();
      var row = document.createElement("div");
      row.setAttribute("data-fw-kuaishou-message", "");
      row.setAttribute("data-direction", "outbound");
      row.setAttribute("data-message-id", mid);
      var content = document.createElement("span");
      content.setAttribute("data-fw-kuaishou-msg-content", "");
      content.textContent = value;
      row.appendChild(content);
      messages.appendChild(row);
    });
  </script>
</body>
